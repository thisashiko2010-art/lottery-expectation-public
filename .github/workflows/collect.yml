name: Collect lottery history

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: lottery-data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run collector tests
        run: |
          python -m unittest discover -s tests -v

      - name: Collect all six lottery games
        run: |
          python collect.py

      - name: Persist collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/normalized reports/collection_report.json
          if git diff --cached --quiet; then
            echo "No lottery data changes."
          else
            git commit -m "chore(data): refresh lottery history"
            git push
          fi

      - name: Upload collected data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lottery-history-${{ github.run_number }}
          path: |
            data/
            reports/
          if-no-files-found: warn
          retention-days: 30
